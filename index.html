<p>
<!-- Image interactive avec script de rotation -->
<img 
    id="photoFoot" 
    src="images/benyapasfoot2.jpg" 
    alt="Galerie foot : cliquez pour changer" 
    width="300" 
    style="cursor: pointer;" 
    onclick="changerImage()"
>

<!-- Le script qui gère la rotation des 6 images -->
<script>
    // Liste des images dans l'ordre exact que vous avez demandé
    const galerie = [
        "images/benyapasfoot2.jpg",
        "images/jesuisaufoot.jpg",
        "images/jeseraienretardaufootonsevoitaufoot.jpg",
        "images/cestquoiladresseduterraindefooot.jpg",
        "images/dimancheavantlefoot.jpg",
        "images/tuasfootaquelleheure.jpg"
    ];

    // Variable pour se souvenir de l'image actuelle (on commence à 0)
    let indexActuel = 0;

    function changerImage() {
        // On passe à l'image suivante
        indexActuel = indexActuel + 1;

        // Si on dépasse la dernière image, on revient à la première (boucle)
        if (indexActuel >= galerie.length) {
            indexActuel = 0;
        }

        // On change la source de l'image affichée
        document.getElementById("photoFoot").src = galerie[indexActuel];
    }
</script>
